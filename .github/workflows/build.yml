name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  client-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Minecraft 26.2 itself requires Java 25 to run (Loom launches the real
      # game to set up the decompiled/mapped dev environment), not just to
      # compile mod code against — Java 21 fails during Loom's Minecraft setup
      # step specifically, this isn't a mod-code compile target choice.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'

      - name: Build client mod
        working-directory: client-mod
        run: gradle build --stacktrace

      - name: Upload client-mod jar
        uses: actions/upload-artifact@v5
        with:
          name: botfleet-control-client-mod
          path: client-mod/build/libs/*.jar
          if-no-files-found: error

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Hub is plain Java, no Minecraft dependency — stays on 21. Gradle 8.10
      # (below) can't even run on JDK 25 (its bundled Groovy/ASM can't parse
      # that new a class file version), so this MUST stay 21, not follow
      # client-mod's JDK 25 requirement.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Build hub
        working-directory: hub
        run: gradle build --stacktrace

      - name: Upload hub jar
        uses: actions/upload-artifact@v5
        with:
          name: botfleet-control-hub
          path: hub/build/libs/hub-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client-mod, hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/botfleet-control-client-mod/*.jar
            artifacts/botfleet-control-hub/*.jar
