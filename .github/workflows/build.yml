name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  client-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 26
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build client mod
        working-directory: client-mod
        run: gradle build --stacktrace

      - name: Upload client-mod jar
        uses: actions/upload-artifact@v7.0.1
        with:
          name: botfleet-control-client-mod
          path: client-mod/build/libs/*.jar
          if-no-files-found: error

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 26
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '26'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build hub
        working-directory: hub
        run: gradle build --stacktrace

      - name: Upload hub jar
        uses: actions/upload-artifact@v7.0.1
        with:
          name: botfleet-control-hub
          path: hub/build/libs/hub-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client-mod, hub]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            artifacts/botfleet-control-client-mod/*.jar
            artifacts/botfleet-control-hub/*.jar
