plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "botfleet-control"
}

repositories {
    mavenCentral()
}

dependencies {
    // 26.1+ ships official Mojang mappings — but Loom still needs it declared
    // explicitly via loom.officialMojangMappings(), it is NOT automatic just
    // because Yarn is gone. Leaving the mappings configuration empty is what
    // caused "Configuration 'mappings' has no dependencies" in CI.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    // Minecraft 26.2 itself requires Java 25 at the toolchain level (Loom needs
    // to actually run the game to set up its dev environment) — this isn't a
    // mod-code style choice, 21 fails during Loom's Minecraft setup step.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

// 26.1+ Loom projects no longer remap the built jar against Yarn — `jar` is the
// final artifact, not `remapJar`.
jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
