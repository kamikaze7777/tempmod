plugins {
    id 'java'
    id 'application'
    // Old coordinate was com.github.johnrengelman.shadow (unmaintained,
    // predates Gradle 9). Current is com.gradleup.shadow — confirmed 9.6.1
    // requires Gradle 9.2.0+ and supports Java 26/27.
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'net.kamikaze'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_26
    targetCompatibility = JavaVersion.VERSION_26
}

application {
    mainClass = 'net.kamikaze.botfleet.hub.Hub'
}

shadowJar {
    archiveBaseName.set('hub')
    archiveClassifier.set('')
}

// The `application` plugin's distZip/distTar/startScripts tasks package the
// plain `jar` task's output plus a runtime classpath — they know nothing
// about shadowJar's fat jar, which lands at the same output path and
// confused Gradle's task-output validation ("uses this output without
// declaring a dependency"). We don't use any of these three tasks — the fat
// jar from shadowJar is the only artifact this project ships — so disable
// them outright rather than wiring up dependency declarations for tasks
// nothing consumes.
tasks.named('distZip') { enabled = false }
tasks.named('distTar') { enabled = false }
tasks.named('startScripts') { enabled = false }

tasks.build.dependsOn tasks.shadowJar
