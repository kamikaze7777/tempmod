plugins {
    id 'java'
    // Old coordinate was com.github.johnrengelman.shadow (unmaintained,
    // predates Gradle 9). Current is com.gradleup.shadow — 9.6.1 requires
    // Gradle 9.2.0+ and supports Java 26/27.
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'net.kamikaze'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_26
    targetCompatibility = JavaVersion.VERSION_26
}

// Deliberately NOT applying the `application` plugin. Its distZip/distTar/
// startScripts tasks (and, with shadow layered on top, the equivalent
// shadowDistZip/shadowDistTar/startShadowScripts tasks) package a runnable
// distribution we never use — this project ships exactly one artifact, the
// shadowJar fat jar, run directly via `java -jar`. Two earlier attempts
// tried disabling those tasks individually (distZip/distTar/startScripts
// first, then hitting startShadowScripts next) and kept resurfacing the
// same implicit-dependency validation error against a different task each
// time, because `application` keeps regenerating new dist-family tasks that
// reference `jar`'s output without knowing about shadowJar. Not applying the
// plugin at all removes the whole task family instead of playing whack-a-mole
// with it. mainClass is set directly on shadowJar's manifest below instead
// of through `application { mainClass = ... }`.
shadowJar {
    archiveBaseName.set('hub')
    archiveClassifier.set('')
    manifest {
        attributes 'Main-Class': 'net.kamikaze.botfleet.hub.Hub'
    }
}

tasks.build.dependsOn tasks.shadowJar
